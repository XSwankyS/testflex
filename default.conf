server {
    listen 80;
    
    location /static/ {
        alias /path/to/static/files/;  # Укажите путь к статическим файлам
    }

    # Проксируем запросы на API к бэкенду
    location /api/ {
        proxy_pass http://web:8000/api/;  # 'web' — это имя контейнера бэкенда
        proxy_set_header Host $host:$server_port;
	proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Host $host;
    }

    # Проксируем остальные запросы к фронтенду
    location / {
        proxy_pass http://frontend:3000/;  # 'frontend' — имя контейнера фронтенда
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
