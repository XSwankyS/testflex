version: '3.8'

networks:
  internal_net:
    driver: bridge

services:
  web:
    build: .
    command: gunicorn test_runner.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    depends_on:
      - redis
      - celery
    ports: 
      - "8000:8000"
    networks:
      - internal_net

  celery:
    build: .
    command: celery -A test_runner worker --loglevel=info --pool=solo
    volumes:
      - .:/app
      - ./tmp:/tmp
    depends_on:
      - redis
    networks:
      - internal_net

  redis:
    image: redis:alpine
    networks:
      - internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - web
    ports:
      - '3000:3000'
    networks:
      - internal_net
  
  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx_conf/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/staticfiles
    depends_on:
      - web
      - frontend
    networks:
      - internal_net
