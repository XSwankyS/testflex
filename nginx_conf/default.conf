server {
    listen 80;

    location /static/ {
        alias /staticfiles/;  # Путь внутри контейнера
    }

    # Проксируем запросы на API к бэкенду
    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $http_host;  # Передаём заголовок Host с портом
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Проксируем остальные запросы к фронтенду
    location / {
        proxy_pass http://frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
